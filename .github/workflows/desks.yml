name: Desks

# Two desks, side by side, with no passwords anywhere.
#
# WHAT THIS REPLACES
#   The old "Remote session" workflow asked you to pick one OS, then handed
#   back a host, a port, a login and a password to type into an RDP client on a
#   phone. The Windows half never worked: the server answered
#   LOGON_FAILED_UPDATE_PASSWORD no matter which of four ways the account was
#   created, and the log that would have explained it is not served while the
#   job runs. Four sessions were spent on it.
#
#   So the password is gone - not hidden, not generated, gone - and with it the
#   whole class of failure. Both desks are now web pages:
#
#     Linux   - XFCE on Xtigervnc, served through noVNC
#     Windows - the runner's own console desktop on TightVNC, served through
#               noVNC
#
#   Both VNC servers offer security type 1 (None), so there is no credential to
#   present. Both are published on their own cloudflared quick tunnel, which
#   needs no account and no token, so two desks can be up at once - something
#   free ngrok could never do with its one-tunnel limit.
#
# WHY THIS IS SAFE ENOUGH, STATED PLAINLY
#   No password means anyone holding the address can drive the desk. The
#   address is a random trycloudflare.com hostname, unguessable in practice,
#   published to a branch of this repository - public if the repository is
#   public. It stops working when the job ends, six hours at most. The runner
#   holds a checkout of this repository and a GITHUB_TOKEN scoped to it, and
#   nothing else of yours. If that trade is not acceptable, make the repository
#   private; everything here keeps working.
#
# WHY THE WINDOWS DESK CAN EXIST AT ALL
#   Measured on a real runner, not assumed. A windows-latest runner logs in as
#   runneradmin on the console, session 2, with explorer running and a
#   1024x768 display attached:
#
#     whoami: runnervm7vqe0\runneradmin
#     process session id: 2
#     >console  runneradmin  2  Active
#     screen \\.\DISPLAY1 {X=0,Y=0,Width=1024,Height=768}
#
#   That is a real desktop, and a VNC server started as an application in that
#   session serves it. Installed as a service it would land in session 0 and
#   serve a blank one.

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which desks to open"
        type: choice
        options: [both, linux, windows]
        default: both
      prepare_build:
        description: "Linux desk: check out Eden and apply the patch first"
        type: boolean
        default: false
      label:
        description: "Name for this session"
        type: string
        default: "desks"

permissions:
  contents: write

jobs:
  # ── Linux desk ─────────────────────────────────────────────────────
  linux:
    if: inputs.which == 'both' || inputs.which == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Install the desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xfce4 xfce4-terminal xfce4-goodies dbus-x11 thunar mousepad \
            tigervnc-standalone-server novnc websockify nginx ttyd tmux htop \
            > /tmp/apt.log 2>&1 || { tail -30 /tmp/apt.log; exit 1; }
          echo "installed"

      - name: Prepare a build environment
        if: inputs.prepare_build
        run: |
          git clone --quiet --branch v0.2.1 \
            https://git.eden-emu.dev/eden-emu/eden.git eden || true
          sudo apt-get install -y -qq glslang-tools libfmt-dev >/dev/null 2>&1 || true
          if [ -d eden ]; then
            bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
              --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden" || true
          fi

      - name: Start the desktop with no password
        run: |
          mkdir -p "$HOME/.vnc"
          # printf, not a heredoc: this block is indented inside the YAML and an
          # indented heredoc writes the leading spaces into the file, which
          # leaves xstartup unrunnable and the desk grey.
          printf '%s\n%s\n%s\n' \
            '#!/bin/sh' \
            'unset SESSION_MANAGER DBUS_SESSION_BUS_ADDRESS' \
            'exec dbus-launch startxfce4' > "$HOME/.vnc/xstartup"
          chmod +x "$HOME/.vnc/xstartup"

          # -SecurityTypes None is the passwordless part. Verified in this
          # workspace against a real Xtigervnc: the server offers exactly one
          # security type and it is 1 (None), so a client connects with nothing
          # to type.
          #
          # -localhost yes keeps the raw VNC port unreachable from outside; the
          # only way in is the tunnel, which speaks WebSocket.
          vncserver -kill :1 >/dev/null 2>&1 || true
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes \
            -SecurityTypes None > /tmp/vnc.log 2>&1
          sleep 4
          ss -lnt | grep -q 5901 || { echo "::error::VNC is not listening"; cat /tmp/vnc.log; exit 1; }

          # Confirm the offer over the wire rather than trusting the flag.
          python3 - <<'PY'
          import socket
          s = socket.create_connection(("127.0.0.1", 5901), 5)
          s.recv(12)
          s.sendall(b"RFB 003.008\n")
          d = s.recv(16)
          types = list(d[1:1+d[0]]) if d else []
          print("security types offered:", types, "(1 = None = no password)")
          raise SystemExit(0 if types == [1] else "expected [1]; a password would be demanded")
          PY

          nohup websockify --web=/usr/share/novnc 6080 localhost:5901 \
            > /tmp/websockify.log 2>&1 &
          nohup ttyd -p 7681 -W bash > /tmp/ttyd.log 2>&1 &
          sleep 3

      - name: Put the desk and a terminal on one port
        run: |
          sudo tee /etc/nginx/sites-available/desk >/dev/null <<'NGINX'
          server {
            listen 8090;
            location / {
              proxy_pass http://127.0.0.1:6080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400;
            }
            location /term/ {
              proxy_pass http://127.0.0.1:7681/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400;
            }
          }
          NGINX
          sudo sed -i 's/^          //' /etc/nginx/sites-available/desk
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/desk /etc/nginx/sites-enabled/desk
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8090/vnc.html \
            || { echo "::error::8090 does not serve the desk"; sudo ss -lntp | grep -E '8090|6080'; exit 1; }
          echo "desk is served locally on 8090"

      - name: Open the tunnel
        run: |
          URL=$(bash "$GITHUB_WORKSPACE/fork/tools/open_tunnel.sh" 8090 /tmp/tunnel.log)
          [ -n "$URL" ] || { echo "::error::no tunnel"; tail -20 /tmp/tunnel.log; exit 1; }
          echo "DESK_URL=$URL" >> "$GITHUB_ENV"
          echo "desk: $URL"

      - name: Publish the address
        run: |
          # autoconnect=1 and no password parameter: the page connects on its
          # own and never shows a credential prompt.
          OPEN="$DESK_URL/vnc.html?autoconnect=1&resize=remote"
          {
            echo "## Linux desk"
            echo ""
            echo "**[Open]($OPEN)** - no password, it connects by itself."
            echo ""
            echo "| Terminal | [$DESK_URL/term/]($DESK_URL/term/) |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
              "slot=linux" "kind=Стол Linux" "os=linux" \
              "url=$DESK_URL" "deskUrl=$OPEN" \
              "terminal=$DESK_URL/term/" \
              "auth=без пароля" \
              "label=${{ inputs.label }}"

      - name: Hold the desk open
        run: |
          # Watch the tunnel instead of sleeping blindly: when cloudflared dies
          # the address keeps resolving and answers 502, which looks like a
          # broken desk rather than a dead tunnel.
          PIDFILE=/tmp/cloudflared-8090.pid
          for i in $(seq 1 1400); do
            sleep 15

            # Check what a visitor sees, not just a pid. On the Windows desk a
            # dead server behind a live tunnel answered 502 and no pid check
            # noticed; the same failure is possible here.
            if ! curl -sf -o /dev/null -m 10 http://127.0.0.1:8090/vnc.html; then
              echo "::warning::the local desk stopped answering; restarting its parts."
              pgrep -f "websockify --web" >/dev/null 2>&1 || \
                nohup websockify --web=/usr/share/novnc 6080 localhost:5901 \
                  > /tmp/websockify2.log 2>&1 &
              pgrep -x ttyd >/dev/null 2>&1 || nohup ttyd -p 7681 -W bash > /tmp/ttyd2.log 2>&1 &
              sudo systemctl is-active --quiet nginx || sudo systemctl restart nginx
              sleep 5
            fi

            PID=$(cat "$PIDFILE" 2>/dev/null || echo)
            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then continue; fi
            echo "::warning::the tunnel exited; restarting it."
            URL=$(bash "$GITHUB_WORKSPACE/fork/tools/open_tunnel.sh" 8090 /tmp/tunnel2.log) || continue
            [ -n "$URL" ] || continue
            echo "back up on $URL"
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
                "slot=linux" "kind=Стол Linux" "os=linux" \
                "url=$URL" "deskUrl=$URL/vnc.html?autoconnect=1&resize=remote" \
                "terminal=$URL/term/" "auth=без пароля" "label=${{ inputs.label }}"
          done

      - name: Clear the published desk
        if: always()
        run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
              "slot=linux" "state=ended" || true

  # ── Windows desk ───────────────────────────────────────────────────
  windows:
    if: inputs.which == 'both' || inputs.which == 'windows'
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Start a VNC server with authentication switched off
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = "$env:TEMP\tightvnc.msi"
          # curl.exe, not Invoke-WebRequest: the .NET stack on this image fails
          # GitHub's redirect to objects.githubusercontent.com with
          # RemoteCertificateNameMismatch. Measured, twice.
          curl.exe -sL --retry 3 -o $msi `
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          if (-not (Test-Path $msi)) { throw "could not download TightVNC" }

          # VALUE_OF_USEVNCAUTHENTICATION=0 is the point of the whole change:
          # the server asks for nothing. The control password is switched off
          # too, otherwise the service refuses to apply settings later.
          $a = @(
            "/i", "`"$msi`"", "/quiet", "/norestart",
            "ADDLOCAL=Server",
            "SERVER_REGISTER_AS_SERVICE=0",
            "SERVER_ADD_FIREWALL_EXCEPTION=1",
            "SET_USEVNCAUTHENTICATION=1", "VALUE_OF_USEVNCAUTHENTICATION=0",
            "SET_USECONTROLAUTHENTICATION=1", "VALUE_OF_USECONTROLAUTHENTICATION=0",
            "SET_ALLOWLOOPBACK=1", "VALUE_OF_ALLOWLOOPBACK=1",
            "SET_ACCEPTHTTPCONNECTIONS=1", "VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          )
          $p = Start-Process msiexec -ArgumentList $a -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"

          # Belt and braces: write the same settings straight to the registry,
          # because the MSI properties are silently ignored on some builds and
          # a server that wants a password is exactly what this is removing.
          # Written to all three hives: the 64-bit build reads
          # HKLM\SOFTWARE\TightVNC\Server, a 32-bit install lands in
          # Wow6432Node, and a server running as a logged-in application also
          # consults HKCU.
          foreach ($key in @(
            "HKLM:\SOFTWARE\TightVNC\Server",
            "HKLM:\SOFTWARE\Wow6432Node\TightVNC\Server",
            "HKCU:\SOFTWARE\TightVNC\Server")) {
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name "AllowLoopback"            -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "UseVncAuthentication"     -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "UseControlAuthentication" -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "LoopbackOnly"             -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "AcceptHttpConnections"    -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "AlwaysShared"             -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "RemoveWallpaper"          -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name "QueryAllowNoPass"         -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "QuerySetting"             -Value 0 -Type DWord
          }

          # As an application, not a service. The runner is logged in on the
          # console in session 2 with a 1024x768 display and explorer running -
          # measured on a real runner. A service would sit in session 0 and
          # hand the browser a blank desktop.
          Stop-Service tvnserver -ErrorAction SilentlyContinue
          Get-Process tvnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "C:\Program Files\TightVNC\tvnserver.exe"
          if (-not (Test-Path $exe)) { throw "TightVNC did not install to $exe" }
          # A scheduled task, not cmd /c start.
          #
          # Two launch styles were tried on a live runner and both hung this
          # step until the run was cancelled - with redirects and without.
          # tvnserver.exe -run does not return, and cmd /c start /b still keeps
          # the step waiting on it. A scheduled task is owned by the task
          # scheduler rather than by this console: Start-ScheduledTask returns
          # immediately and the server keeps running after the step ends.
          #
          # It must run as the logged-in console user, not SYSTEM: the desktop
          # worth showing belongs to runneradmin in session 2, and a SYSTEM
          # task would land in session 0 and capture a blank one.
          $me = "$env:USERDOMAIN\$env:USERNAME"
          Write-Host "starting the VNC server as $me"
          schtasks /Create /TN "symbiosis-vnc" /TR "`"$exe`" -run" /SC ONCE /ST 00:00 `
            /RU $me /IT /F | Out-Null
          schtasks /Run /TN "symbiosis-vnc" | Out-Null

          $proc = $null
          foreach ($try in 1..15) {
            Start-Sleep -Seconds 2
            $proc = Get-Process tvnserver -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($proc) { break }
          }
          if (-not $proc) {
            # Fall back to the direct launch rather than giving up: it may hang
            # this step, but a hung step with a working desk beats no desk.
            Write-Host "::warning::the scheduled task did not start it; launching directly"
            cmd /c start "" /b "$exe" -run "1>$env:TEMP\tvn.log" "2>$env:TEMP\tvn.err"
            Start-Sleep -Seconds 6
          }
          $proc = Get-Process tvnserver -ErrorAction SilentlyContinue
          if (-not $proc) { throw "tvnserver did not stay running" }
          Write-Host ("tvnserver pid {0} in session {1}" -f $proc.Id, $proc.SessionId)

      - name: Confirm no password is demanded, over the wire
        shell: pwsh
        run: |
          # Trusting the registry is how the RDP attempt went wrong four times:
          # every flag read back correct and the client was still refused. Ask
          # the server itself what it offers.
          $ok = $false
          foreach ($try in 1..10) {
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", 5900)
              $s = $c.GetStream()
              $buf = New-Object byte[] 12
              $n = $s.Read($buf, 0, 12)
              Write-Host "banner: $([System.Text.Encoding]::ASCII.GetString($buf,0,$n).Trim())"
              $ver = [System.Text.Encoding]::ASCII.GetBytes("RFB 003.008`n")
              $s.Write($ver, 0, $ver.Length)
              $sec = New-Object byte[] 8
              $m = $s.Read($sec, 0, 8)
              $count = $sec[0]
              $types = @()
              for ($i = 1; $i -le $count -and $i -lt $m; $i++) { $types += $sec[$i] }
              Write-Host "security types offered: $($types -join ',') (1 = None)"
              $c.Close()
              if ($types -contains 1) { $ok = $true }
              break
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ok) { throw "the VNC server is not offering type 1 (None); a password would be demanded" }

      - name: Serve it as a web page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m pip install --quiet --disable-pip-version-check websockify

          # noVNC is just static files; websockify serves them and bridges the
          # WebSocket to port 5900.
          curl.exe -sL --retry 3 -o "$env:TEMP\novnc.tgz" `
            "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\novnc" | Out-Null
          tar -xzf "$env:TEMP\novnc.tgz" -C "$env:TEMP\novnc"
          $web = Get-ChildItem "$env:TEMP\novnc" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "noVNC at $web"
          "NOVNC_WEB=$web" | Out-File -FilePath $env:GITHUB_ENV -Append

          # cmd /c start, NOT Start-Process.
          #
          # A process launched with Start-Process is killed when the step that
          # started it ends. Measured directly: three websockify servers were
          # started in one step - Start-Process on 6080, cmd /c start on 6081,
          # a scheduled task on 6082. All three answered 200 inside that step.
          # In the very next step 6080 was gone (HTTP 000) while 6081 and 6082
          # were still serving, and still serving two minutes later.
          #
          # That is exactly what made the Windows desk answer 502: the tunnel
          # stayed up, and the thing behind it had been killed at the step
          # boundary.
          cmd /c start "" /b python -m websockify --web="$web" 6080 127.0.0.1:5900 `
            "1>$env:TEMP\ws.log" "2>$env:TEMP\ws.err"
          Start-Sleep -Seconds 8
          $r = try { Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:6080/vnc.html" -TimeoutSec 15 } catch { $null }
          if (-not $r -or $r.StatusCode -ne 200) {
            Get-Content "$env:TEMP\ws.log","$env:TEMP\ws.err" -ErrorAction SilentlyContinue | Write-Host
            throw "websockify is not serving the page on 6080"
          }
          Write-Host "noVNC is serving locally on 6080"

      - name: Open the tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cf = "$env:TEMP\cloudflared.exe"
          curl.exe -sL --retry 3 -o $cf `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          if (-not (Test-Path $cf)) { throw "could not download cloudflared" }

          # A quick tunnel: no account, no token, and as many as we like - which
          # is why both desks can be up at the same time. ngrok's free plan
          # allows one, so it could never do this.
          # Detached the same way as websockify, and for the same reason.
          $log = "$env:TEMP\cf.log"
          cmd /c start "" /b "$cf" tunnel --url http://localhost:6080 --no-autoupdate --loglevel info `
            "1>$log" "2>$env:TEMP\cf.err"

          $url = $null
          foreach ($try in 1..40) {
            Start-Sleep -Seconds 2
            $text = (Get-Content $log,"$env:TEMP\cf.err" -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($text -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
          }
          if (-not $url) {
            Get-Content $log,"$env:TEMP\cf.err" -Tail 30 -ErrorAction SilentlyContinue | Write-Host
            throw "cloudflared did not report an address"
          }

          # The hostname exists before the edge will serve it; a client that
          # opens it too early sees 502 and blames the desk.
          foreach ($try in 1..20) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "$url/vnc.html" -TimeoutSec 15
              if ($r.StatusCode -eq 200) { break }
            } catch { Start-Sleep -Seconds 3 }
          }
          "DESK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "desk: $url"

      - name: Publish the address
        shell: pwsh
        run: |
          $open = "$env:DESK_URL/vnc.html?autoconnect=1&resize=remote"
          @(
            "## Windows desk",
            "",
            "**[Open]($open)** - no password, it connects by itself.",
            "",
            "This is the runner's own console desktop, session 2."
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
            "slot=windows" "kind=Стол Windows" "os=windows" `
            "url=$env:DESK_URL" "deskUrl=$open" `
            "auth=без пароля" "label=${{ inputs.label }}"

      - name: Hold the desk open
        shell: pwsh
        run: |
          Write-Host "The desk stays up until you cancel this run, or for six hours."
          $cf = "$env:TEMP\cloudflared.exe"
          $web = $env:NOVNC_WEB
          for ($i = 0; $i -lt 1400; $i++) {
            Start-Sleep -Seconds 15

            # Watch what a visitor would see, not a process id. A dead
            # websockify behind a live tunnel answers 502, which no PID check
            # would ever notice - and that is the failure that actually
            # happened.
            $local = (curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:6080/vnc.html")
            if ($local -ne "200") {
              Write-Host "::warning::websockify stopped answering ($local); restarting it."
              cmd /c start "" /b python -m websockify --web="$web" 6080 127.0.0.1:5900 `
                "1>$env:TEMP\ws2.log" "2>$env:TEMP\ws2.err"
              Start-Sleep -Seconds 8
            }

            if (Get-Process cloudflared -ErrorAction SilentlyContinue) { continue }

            Write-Host "::warning::the tunnel exited; restarting it."
            $log = "$env:TEMP\cf2.log"
            cmd /c start "" /b "$cf" tunnel --url http://localhost:6080 --no-autoupdate --loglevel info `
              "1>$log" "2>$env:TEMP\cf2.err"
            $url = $null
            foreach ($try in 1..30) {
              Start-Sleep -Seconds 2
              $text = (Get-Content $log,"$env:TEMP\cf2.err" -Raw -ErrorAction SilentlyContinue) -join "`n"
              if ($text -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
            }
            if ($url) {
              Write-Host "back up on $url"
              $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
              bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
                "slot=windows" "kind=Стол Windows" "os=windows" `
                "url=$url" "deskUrl=$url/vnc.html?autoconnect=1&resize=remote" `
                "auth=без пароля" "label=${{ inputs.label }}"
            }
          }

      - name: Clear the published desk
        if: always()
        shell: pwsh
        run: |
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
            "slot=windows" "state=ended"
