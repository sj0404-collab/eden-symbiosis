name: Build clean

# Builds official Eden with patch2 on top - four modified files, nothing else.
#
# WHY A SECOND WORKFLOW
#   build.yml applies the old Symbiosis tree: 13 extra screens, 376 KB of C++,
#   and the retro launcher whose early return in SetWindowAdaptPass() caused
#   the settings crash. This one starts from clean upstream and adds only what
#   was actually asked for, so anything that breaks here is mine and recent.
#
# WHAT PATCH2 CHANGES
#   Game.kt          a game records the folder it was found in
#   GameHelper.kt    that folder is carried down the scan; depth 3 -> 24
#   GamesFragment.kt the list is ordered by folder, then by title
#   SharedDataDirectory.kt   the shared-folder utility, unchanged
#
#   Nothing is created, moved or written. Folder permissions stay read-only and
#   config.ini is untouched.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug keeps symbols; release runs R8"
        type: choice
        options: [debug, release]
        default: debug
      upload_to_gofile:
        description: "Also upload the APK to gofile.io"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'patch2/**'
      - 'tools/apply_patch2.sh'
      - '.github/workflows/build2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream Eden
        run: |
          # Retried, with our mirror behind it: git.eden-emu.dev answered 502
          # mid-build once and took the whole run down with it.
          ok=0
          for attempt in 1 2 3; do
            if git clone --branch v0.2.1 \
                 https://git.eden-emu.dev/eden-emu/eden.git eden 2>/tmp/clone.log; then
              ok=1; break
            fi
            echo "attempt $attempt failed:"; tail -3 /tmp/clone.log
            rm -rf eden
            sleep $((attempt * 10))
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::upstream unreachable; using our mirror"
            git clone https://github.com/sj0404-collab/eden-upstream-reference.git eden \
              || { echo "::error::neither upstream nor the mirror could be cloned"; exit 1; }
          fi
          cd eden && echo "upstream: $(git rev-parse --short HEAD)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and glslang
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" \
            "build-tools;35.0.0" "platforms;android-36" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools > /dev/null

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle2-${{ runner.os }}-${{ hashFiles('eden/src/android/**/*.gradle*') }}
          restore-keys: gradle2-${{ runner.os }}-

      # ── Why the build took twenty-five minutes ──────────────────────
      #
      # Measured from a real run's timestamps:
      #     12:49:41  Kotlin compiled
      #     12:51:38  ninja started
      #     13:11:56  APK ready          <- twenty minutes of C++
      #
      # 1353 C++ objects were rebuilt from scratch. patch2 contains nine .kt
      # files and three .xml files and NOT ONE .cpp - so every second of that
      # was spent recompiling code nobody touched.
      #
      # ccache fixes exactly this: identical source plus identical flags means
      # the object file is copied out of the cache instead of compiled. The
      # first run after this fills the cache and is no faster; every run after
      # that skips the part that dominates the clock.
      # ── Two bugs in the first attempt at this, both proved by run #9 ──
      #
      # BUG 1: THE CACHE WAS SAVED SOMEWHERE ELSE THAN IT WAS READ
      #   The path here said ~/.ccache. ccache itself reported
      #       (default) cache_dir = /home/runner/.cache/ccache
      #   so 1678 freshly compiled objects were written to a directory the
      #   cache action never packed. Nothing was wrong with ccache and nothing
      #   was wrong with the key - the two halves simply pointed at different
      #   folders. CCACHE_DIR is now set explicitly and the path below is the
      #   same variable, so they cannot drift apart again.
      #
      # BUG 2: HASHED PATHS DEFEAT THE CACHE ACROSS RUNS
      #   NDK builds bake absolute paths into the object; ccache's default
      #   direct mode hashes the compiler binary's mtime too. On a fresh
      #   runner that is a different value every time, which is why run #9
      #   showed 0.89% hits even for the objects it had just built - the 15
      #   hits it did get were all "preprocessed", never "direct".
      #   base_dir + hash_dir=false + compiler_check=content fix exactly that.
      - name: Cache the C++ objects
        uses: actions/cache@v4
        with:
          # Must match CCACHE_DIR below. It did not, and that alone cost the
          # entire 20 minutes this step exists to save.
          path: ~/.cache/ccache
          # Keyed on the upstream tag, not on our patch: our patch never
          # changes a .cpp, so a new key would throw away a cache that is
          # still perfectly valid.
          key: ccache-eden-v0.2.1-${{ inputs.build_type || 'debug' }}-${{ github.run_number }}
          restore-keys: |
            ccache-eden-v0.2.1-${{ inputs.build_type || 'debug' }}-
            ccache-eden-v0.2.1-

      - name: Set up ccache
        run: |
          sudo apt-get install -y -qq ccache > /dev/null

          # Pinned, not defaulted - see BUG 1 above.
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"

          # 3 GB: the full object set for one build type is well under that,
          # and the runner cache limit is 10 GB per repository.
          ccache --set-config=max_size=3G
          # Absolute build paths differ between runs; rewrite them relative to
          # the workspace so the same source hashes the same way.
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=hash_dir=false
          # The NDK clang binary's mtime changes per runner image; hash what
          # the compiler *is*, not when it was written.
          ccache --set-config=compiler_check=content
          # Harmless for correctness, and stops a changed -I ordering from
          # missing on otherwise identical translation units.
          ccache --set-config=namespace=eden-v0.2.1
          ccache --zero-stats

          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --show-config | grep -E "max_size|cache_dir|base_dir|hash_dir|compiler_check"

      - name: Apply patch2
        run: bash fork/tools/apply_patch2.sh --patch fork/patch2 --eden "$GITHUB_WORKSPACE/eden"

      # Cached: an 85 MB download that is identical every run, and when it
      # half-arrived once the whole build died at unzip with "End-of-central-
      # directory signature not found" - after the runner had already spent
      # four minutes installing the NDK.
      - name: Cache the Kotlin compiler
        uses: actions/cache@v4
        with:
          path: /tmp/kotlinc
          key: kotlinc-2.0.21

      - name: Check the folder logic before building
        run: |
          # Twenty seconds here against twenty-five minutes of compiling. All
          # three tests run against plain Kotlin - no Android, no device.
          set -euo pipefail

          # The published checksum. A truncated download is otherwise only
          # discovered by unzip failing, which is what happened in run #10.
          KC_SHA=0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a

          if [ ! -x /tmp/kotlinc/bin/kotlinc ]; then
            ok=0
            for attempt in 1 2 3; do
              curl -fsSL --retry 3 --retry-all-errors -o /tmp/kc.zip \
                https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip || true
              if [ "$(sha256sum /tmp/kc.zip 2>/dev/null | cut -d' ' -f1)" = "$KC_SHA" ]; then
                ok=1; break
              fi
              echo "attempt $attempt: bad or missing download, retrying"
              rm -f /tmp/kc.zip
            done
            [ "$ok" = 1 ] || { echo "::error::could not download the Kotlin compiler"; exit 1; }
            rm -rf /tmp/kotlinc
            unzip -qo /tmp/kc.zip -d /tmp
          else
            echo "kotlinc restored from cache"
          fi

          fail=0

          for t in FolderScanTest GroupByFolderTest CardSubtitleTest; do
            echo "── $t ──"
            /tmp/kotlinc/bin/kotlinc "fork/patch2/tests/$t.kt" -include-runtime -d "/tmp/$t.jar" 2>&1 |
              grep -vE "^warning: (classpath|language version)" || true
            java -Dfile.encoding=UTF-8 -jar "/tmp/$t.jar" || fail=1
          done

          # ── The core loader, tested for the first time ──────────────
          #
          # CoreFromFolderTest existed but nothing ever ran it, so the file
          # that decides whether the emulator has a core at all was the one
          # piece with no check on it. Every failure it guards is silent: a
          # truncated core that dlopen maps and then dies inside, a copy left
          # writable that Android 14+ refuses, a stale copy never refreshed.
          #
          # It needs four members of the Android API, stubbed in
          # patch2/tests/stubs_android*.kt, so the real logic runs on the JVM.
          echo "── CoreFromFolderTest ──"
          rm -rf /tmp/cft /tmp/cfbuild && mkdir -p /tmp/cfbuild
          cp fork/patch2/android/utils/CoreFromFolder.kt \
             fork/patch2/tests/CoreFromFolderTest.kt \
             fork/patch2/tests/stubs_android.kt \
             fork/patch2/tests/stubs_android_os.kt /tmp/cfbuild/
          /tmp/kotlinc/bin/kotlinc /tmp/cfbuild/*.kt -include-runtime -d /tmp/cf.jar 2>&1 |
            grep -vE "^warning: (classpath|language version)" || true
          java -Dfile.encoding=UTF-8 -jar /tmp/cf.jar 2>/dev/null || fail=1

          exit $fail

      - name: Build
        run: |
          cd eden/src/android
          TYPE="${{ inputs.build_type }}"
          TYPE="${TYPE:-debug}"

          # Upstream already reads a property for extra CMake flags:
          #
          #   val extraCMakeArgs =
          #     (project.findProperty("YUZU_ANDROID_ARGS") as String?)?.split(...)
          #
          # so ccache goes in through the front door, with no edit to Eden's
          # build files. Environment variables alone would NOT work - AGP
          # invokes CMake itself and does not forward them into the configure
          # step, which is the trap that makes people think ccache "did
          # nothing".
          CCACHE_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ "$TYPE" = "release" ]; then
            ./gradlew assembleLegacyRelease -PYUZU_ANDROID_ARGS="$CCACHE_FLAGS" \
              --parallel --build-cache --max-workers="$(nproc)"
          else
            ./gradlew assembleLegacyDebug -PYUZU_ANDROID_ARGS="$CCACHE_FLAGS" \
              --parallel --build-cache --max-workers="$(nproc)"
          fi

      - name: How much the cache saved
        if: always()
        run: |
          # Printed every run so the effect is visible, not assumed. A first
          # run shows 0% and fills the cache; the next should show most of the
          # 1353 objects coming back as hits.
          ccache --show-stats | head -20

      - name: Verify the changes shipped
        run: |
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "MD5: $(md5sum "$APK" | cut -d' ' -f1)"

          mkdir -p /tmp/x && cd /tmp/x
          unzip -qo "$GITHUB_WORKSPACE/$APK" 'classes*.dex'

          fail=0
          case "$APK" in
            *release*) echo "  (release: Kotlin names are minified, skipping the name check)" ;;
            *)
              # groupByFolder is ours and cannot come from anywhere else.
              for sym in groupByFolder folderName; do
                if strings classes*.dex | grep -q "$sym"; then echo "  ok   $sym in dex"
                else echo "  MISSING $sym"; fail=1; fi
              done ;;
          esac

          python3 - "$GITHUB_WORKSPACE/$APK" <<'SIZEPY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, zipfile, os
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          mb = lambda b: b / 1048576
          total = os.path.getsize(apk)
          dex = sum(i.compress_size for i in z.infolist() if i.filename.endswith('.dex'))
          so = sum(i.compress_size for i in z.infolist() if i.filename.endswith('.so'))
          print("## APK")
          print()
          print("| | |")
          print("|---|---|")
          print(f"| size | **{mb(total):.1f} MB** |")
          print(f"| dex | {mb(dex):.1f} MB packed |")
          print(f"| native | {mb(so):.1f} MB packed |")
          SIZEPY

          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-clean-patch2
          path: eden/src/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # ── The core, packaged as a folder to keep on the device ────────
      #
      # The point of the split: the core is 83 MB of C++ that almost never
      # changes, while a typical change here is a Kotlin file. Downloaded once
      # and kept, it turns every later update into a small APK.
      #
      # Published as a zip of a folder named EdenCore, which is exactly what
      # CoreFromFolder looks for on each storage volume. Unzip to the root of
      # internal storage or an SD card and the app finds it.
      - name: Package the core as a folder
        run: |
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          mkdir -p /tmp/pack/EdenCore
          cd /tmp/pack

          # Straight out of the APK that was just built, so the core and the
          # client are guaranteed to be the same build. Extracting from the
          # build tree instead would risk picking up a stale object.
          unzip -qo "$GITHUB_WORKSPACE/$APK" 'lib/arm64-v8a/*.so' -d raw

          # The validation layer is deliberately left out: 24 MB of debugging
          # aid that also costs frame rate.
          for f in raw/lib/arm64-v8a/*.so; do
            case "$(basename "$f")" in
              libVkLayer_*) continue ;;
            esac
            cp "$f" EdenCore/
          done

          # A README in the folder, because a bare .so tells nobody anything.
          {
            echo "Ядро эмулятора Eden для Symbiosis"
            echo
            echo "Положите папку EdenCore целиком в память устройства - в корень"
            echo "внутренней памяти или на карту. Приложение найдёт её само при"
            echo "запуске."
            echo
            echo "Проверяются имена: EdenCore, eden-core, Eden/core"
            echo
            echo "Файлы:"
            for f in EdenCore/*.so; do
              echo "  $(basename "$f")  $(du -h "$f" | cut -f1)"
            done
            echo
            echo "Собрано из Eden v0.2.1, сборка #${{ github.run_number }}."
            echo "Обновлять нужно только если менялся C++ - обычные обновления"
            echo "приложения этот файл не трогают."
          } > EdenCore/README.txt

          # Checksums, so a half-copied file can be spotted without guessing.
          (cd EdenCore && sha256sum *.so > SHA256SUMS.txt)

          zip -qr /tmp/EdenCore.zip EdenCore
          echo "core folder: $(du -h /tmp/EdenCore.zip | cut -f1)"
          ls -la EdenCore/

          python3 - <<'CORESIZE' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          total = sum(os.path.getsize(os.path.join('/tmp/pack/EdenCore', f))
                      for f in os.listdir('/tmp/pack/EdenCore'))
          zipped = os.path.getsize('/tmp/EdenCore.zip')
          print()
          print("## Core folder")
          print()
          print("| | |")
          print("|---|---|")
          print(f"| unpacked | {total / 1048576:.1f} MB |")
          print(f"| zip | {zipped / 1048576:.1f} MB |")
          print()
          print("Unzip `EdenCore` to the root of internal storage or an SD card.")
          CORESIZE

      - uses: actions/upload-artifact@v4
        with:
          name: EdenCore-folder
          path: /tmp/EdenCore.zip
          retention-days: 30

      # ── The thin APK: the whole point of the split ──────────────────
      #
      # Until now nothing actually got smaller. The core folder was published,
      # but the same 23 MB of core was still packed inside the APK, so the
      # download was 45 MB and the folder was 20 MB more on top - strictly
      # worse than before. Measured from the built APK:
      #
      #     23.01 MB  lib/arm64-v8a/libyuzu-android.so     <- the core
      #      7.66 MB  libVkLayer_khronos_validation.so     <- debug aid
      #      9.00 MB  classes*.dex                          (debug build)
      #
      # Removing those two entries is what leaves a small APK. CoreFromFolder
      # already prefers the built-in core when there is one and falls back to
      # the folder when there is not, so the thin APK needs no code change -
      # it is the same build with two files removed.
      #
      # WHY RE-SIGN AND NOT JUST DELETE
      #   An APK's signature covers the file list. Deleting an entry from a
      #   signed APK leaves a package Android refuses to install with
      #   INSTALL_PARSE_FAILED_NO_CERTIFICATES. So: unpack, drop, zipalign,
      #   sign again with the very debug keystore upstream ships and uses for
      #   its own default signing config.
      - name: Build the thin APK, with the core left out
        run: |
          set -euo pipefail
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          BT="$ANDROID_HOME/build-tools/35.0.0"

          rm -rf /tmp/thin && mkdir -p /tmp/thin/x
          cd /tmp/thin/x
          unzip -qo "$GITHUB_WORKSPACE/$APK"

          before=$(stat -c%s "$GITHUB_WORKSPACE/$APK")

          # The core: it lives in the EdenCore folder now.
          rm -f lib/arm64-v8a/libyuzu-android.so
          # The Vulkan validation layer: 24 MB of debugging aid that also
          # costs frame rate. It is not in the core folder either.
          rm -f lib/arm64-v8a/libVkLayer_*.so

          # Old signature covers a file list that no longer matches.
          rm -rf META-INF/*.SF META-INF/*.RSA META-INF/*.DSA

          # Stored, not deflated, for the .so files: upstream sets
          # jniLibs.useLegacyPackaging = true, and a compressed .so in a
          # legacy-packaged APK is extracted at install time instead of being
          # mapped, which is slower and doubles the space used.
          zip -qr /tmp/thin/unsigned.apk . -x '*.so'
          zip -qr -Z store /tmp/thin/unsigned.apk . -i '*.so'

          "$BT/zipalign" -p -f 4 /tmp/thin/unsigned.apk /tmp/thin/aligned.apk

          "$BT/apksigner" sign \
            --ks eden/src/android/app/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out /tmp/thin/Eden-thin.apk /tmp/thin/aligned.apk 2>/dev/null ||
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/eden/src/android/app/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out /tmp/thin/Eden-thin.apk /tmp/thin/aligned.apk

          # A signature that does not verify is an APK that will not install,
          # and that is only discovered on the device otherwise.
          "$BT/apksigner" verify --verbose /tmp/thin/Eden-thin.apk | head -5

          after=$(stat -c%s /tmp/thin/Eden-thin.apk)
          echo "MD5: $(md5sum /tmp/thin/Eden-thin.apk | cut -d' ' -f1)"

          # The core must be gone, and the loader must still be there. Both
          # checked, because "smaller" and "correct" are different claims.
          if unzip -l /tmp/thin/Eden-thin.apk | grep -q libyuzu-android.so; then
            echo "::error::the core is still inside the thin APK"; exit 1
          fi
          for keep in libhook_impl.so libmain_hook.so; do
            unzip -l /tmp/thin/Eden-thin.apk | grep -q "$keep" ||
              { echo "::error::$keep went missing"; exit 1; }
          done

          python3 - "$before" "$after" <<'THINPY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          before, after = int(sys.argv[1]), int(sys.argv[2])
          mb = lambda b: b / 1048576
          print()
          print("## Thin APK")
          print()
          print("| | |")
          print("|---|---|")
          print(f"| full APK | {mb(before):.1f} MB |")
          print(f"| thin APK | **{mb(after):.1f} MB** |")
          print(f"| saved | {mb(before - after):.1f} MB |")
          print()
          print("Needs the `EdenCore` folder on the device. The full APK does not.")
          THINPY

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-thin-apk
          path: /tmp/thin/Eden-thin.apk
          retention-days: 30

      - name: Upload to gofile.io
        if: github.event_name != 'workflow_dispatch' || inputs.upload_to_gofile
        run: |
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          SRV=$(curl -s https://api.gofile.io/servers |
            python3 -c "import sys,json;print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          curl -s -F "file=@$APK" "https://$SRV.gofile.io/contents/uploadfile" -o /tmp/up.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('/tmp/up.json'))['data']
          print(f"\n- **Download:** {d['downloadPage']}")
          print(f"- **MD5:** `{d['md5']}`")
          print(f"- **Size:** {round(d['size']/1048576,1)} MB")
          PY
          cat "$GITHUB_STEP_SUMMARY"
