name: Desk probe

# Round six. The Windows desk serves, accepts with no password, and shows a
# BLACK SCREEN. Everything else is proven; this is the last unknown.
#
# WHAT IS ALREADY FACT, measured on real runners:
#   * the runner is logged in on the console as runneradmin, session 2, with a
#     1024x768 display, explorer running, and a genuine Windows Server 2025
#     desktop - a screenshot taken by a step shows the taskbar and a Notepad
#     window
#   * TightVNC accepts with security type 1 (None): no password anywhere
#   * the page is reachable through a Cloudflare quick tunnel from outside
#   * a framebuffer captured through that tunnel is 1024x768 and entirely
#     black - one single colour, checked pixel by pixel
#
# So the server is capturing the wrong desktop, or a blanked one. Two
# candidates, and I do not intend to guess between them again:
#
#   A. run as an APPLICATION, started by the task scheduler. That is what the
#      workflow does now.
#   B. run as a SERVICE. I previously wrote off service mode as "session 0, so
#      blank" - that was reasoning, not measurement, and it may well be
#      backwards: a VNC service on Windows runs as SYSTEM specifically so it
#      can attach to whichever desktop is current.
#
# This job tries both, in order, and after each one captures an actual frame
# from the server with a real VNC client and counts the distinct colours. One
# colour means black. The PNGs are uploaded either way.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Tools and a reference screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          python -m pip install --quiet --disable-pip-version-check vncdotool pillow

          # What the session really looks like, captured by this step - the
          # yardstick every VNC frame below is compared against.
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          $bmp.Save("shots\0-reference.png")
          Write-Host "reference saved, $($b.Width)x$($b.Height)"
          (query session 2>&1 | Out-String) | Write-Host
          exit 0

      - name: Install TightVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -sL --retry 3 -o "$env:TEMP\tightvnc.msi" `
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          # Registered as a service here, because case B needs it and case A can
          # simply stop it.
          $a = @("/i", "`"$env:TEMP\tightvnc.msi`"", "/quiet", "/norestart",
                 "ADDLOCAL=Server", "SERVER_REGISTER_AS_SERVICE=1",
                 "SERVER_ADD_FIREWALL_EXCEPTION=1",
                 "SET_USEVNCAUTHENTICATION=1", "VALUE_OF_USEVNCAUTHENTICATION=0",
                 "SET_USECONTROLAUTHENTICATION=1", "VALUE_OF_USECONTROLAUTHENTICATION=0")
          Start-Process msiexec -ArgumentList $a -Wait | Out-Null
          foreach ($k in @("HKLM:\SOFTWARE\TightVNC\Server",
                           "HKLM:\SOFTWARE\Wow6432Node\TightVNC\Server",
                           "HKCU:\SOFTWARE\TightVNC\Server")) {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name "AllowLoopback"            -Value 1 -Type DWord
            Set-ItemProperty -Path $k -Name "LoopbackOnly"             -Value 1 -Type DWord
            Set-ItemProperty -Path $k -Name "UseVncAuthentication"     -Value 0 -Type DWord
            Set-ItemProperty -Path $k -Name "UseControlAuthentication" -Value 0 -Type DWord
            Set-ItemProperty -Path $k -Name "RemoveWallpaper"          -Value 0 -Type DWord
            Set-ItemProperty -Path $k -Name "AlwaysShared"             -Value 1 -Type DWord
          }
          Write-Host "installed"

      - name: Case B - as a service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Get-Process tvnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Restart-Service tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8
          (Get-Service tvnserver | Out-String) | Write-Host
          (Get-Process tvnserver -ErrorAction SilentlyContinue |
            Select-Object Id, SessionId | Out-String) | Write-Host

          python -m vncdotool.command -s 127.0.0.1::5900 capture shots\1-service.png 2>&1 | Write-Host
          exit 0

      - name: Case A - as an application in the console session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Stop-Service tvnserver -Force -ErrorAction SilentlyContinue
          Get-Process tvnserver -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          $exe = "C:\Program Files\TightVNC\tvnserver.exe"
          $me  = "$env:USERDOMAIN\$env:USERNAME"
          schtasks /Create /TN "symbiosis-vnc" /TR "`"$exe`" -run" /SC ONCE /ST 00:00 `
            /RU $me /IT /F | Out-Null
          schtasks /Run /TN "symbiosis-vnc" | Out-Null
          Start-Sleep -Seconds 8
          (Get-Process tvnserver -ErrorAction SilentlyContinue |
            Select-Object Id, SessionId | Out-String) | Write-Host

          python -m vncdotool.command -s 127.0.0.1::5900 capture shots\2-app.png 2>&1 | Write-Host
          exit 0

      - name: Count the colours in each frame
        shell: pwsh
        run: |
          # One distinct colour means a black rectangle. The reference frame is
          # there to prove the counting itself is sound.
          $py = @(
            'from PIL import Image',
            'import os, glob',
            'for f in sorted(glob.glob("shots/*.png")):',
            '    im = Image.open(f).convert("RGB")',
            '    cols = im.getcolors(maxcolors=500000)',
            '    n = len(cols) if cols else 500000',
            '    print(f"{os.path.basename(f):20s} {im.size}  distinct colours: {n}  ",',
            '          "BLACK" if n <= 2 else "REAL DESKTOP")'
          ) -join "`n"
          $py | Out-File -FilePath count.py -Encoding utf8
          python count.py
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-frames
          path: shots
          if-no-files-found: warn
