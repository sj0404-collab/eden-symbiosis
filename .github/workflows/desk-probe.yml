name: Desk probe

# Round five. One question: what kills websockify on the Windows runner?
#
# WHERE THIS STANDS
#   Round four proved the whole Windows chain works when it all happens inside
#   a single step: VNC accepts with security type 1 (None), noVNC serves, and
#   the page answers HTTP 200 through the Cloudflare tunnel from outside.
#
#   In the real workflow the same chain is split across steps, and the desk
#   answered 502 - "tunnel up, nothing behind it". cloudflared, started the
#   same way in a later step, survived. So it is not blanket step teardown:
#   something specific happens to websockify.
#
#   Two candidates, and this run distinguishes them:
#     A. the process is killed when its step ends
#     B. it crashes later, on its own or on the first real connection
#
#   Step 2 starts it. Step 3 - a different step, so a different console - asks
#   whether it is still alive and prints its log either way. Step 4 hits it
#   through a tunnel and asks again. Guessing between A and B would cost a
#   session each time; this costs five minutes once.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Start VNC and websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -sL --retry 3 -o "$env:TEMP\tightvnc.msi" `
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          $a = @("/i", "`"$env:TEMP\tightvnc.msi`"", "/quiet", "/norestart",
                 "ADDLOCAL=Server", "SERVER_REGISTER_AS_SERVICE=0",
                 "SET_USEVNCAUTHENTICATION=1", "VALUE_OF_USEVNCAUTHENTICATION=0",
                 "SET_USECONTROLAUTHENTICATION=1", "VALUE_OF_USECONTROLAUTHENTICATION=0")
          Start-Process msiexec -ArgumentList $a -Wait | Out-Null
          foreach ($k in @("HKLM:\SOFTWARE\TightVNC\Server",
                           "HKLM:\SOFTWARE\Wow6432Node\TightVNC\Server",
                           "HKCU:\SOFTWARE\TightVNC\Server")) {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name "AllowLoopback"            -Value 1 -Type DWord
            Set-ItemProperty -Path $k -Name "LoopbackOnly"             -Value 1 -Type DWord
            Set-ItemProperty -Path $k -Name "UseVncAuthentication"     -Value 0 -Type DWord
            Set-ItemProperty -Path $k -Name "UseControlAuthentication" -Value 0 -Type DWord
          }
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          python -m pip install --quiet --disable-pip-version-check websockify
          curl.exe -sL --retry 3 -o "$env:TEMP\novnc.tgz" `
            "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\novnc" | Out-Null
          tar -xzf "$env:TEMP\novnc.tgz" -C "$env:TEMP\novnc"
          $web = Get-ChildItem "$env:TEMP\novnc" -Directory | Select-Object -First 1 -ExpandProperty FullName

          # Three ways of launching the same server, so the survivor is
          # identified rather than guessed at.
          #
          #   6080 - Start-Process, exactly as the real workflow does it
          #   6081 - the same, but detached from this console's job object via
          #          cmd /c start, which is the classic way to outlive a step
          #   6082 - a scheduled task, which the service control manager owns
          #          and no console teardown can touch
          Start-Process python -ArgumentList "-m","websockify","--web=`"$web`"","6080","127.0.0.1:5900" `
            -RedirectStandardOutput "$env:TEMP\ws80.log" -RedirectStandardError "$env:TEMP\ws80.err" `
            -WindowStyle Hidden
          "PY_WEB=$web" | Out-File -FilePath $env:GITHUB_ENV -Append

          cmd /c start "" /b python -m websockify --web="$web" 6081 127.0.0.1:5900 `
            "1>$env:TEMP\ws81.log" "2>$env:TEMP\ws81.err"

          $action = New-ScheduledTaskAction -Execute "python" `
            -Argument "-m websockify --web=`"$web`" 6082 127.0.0.1:5900"
          Register-ScheduledTask -TaskName "wsk" -Action $action `
            -User "SYSTEM" -RunLevel Highest -Force | Out-Null
          Start-ScheduledTask -TaskName "wsk"

          Start-Sleep -Seconds 8
          foreach ($p in 6080, 6081, 6082) {
            $code = (curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:$p/vnc.html")
            Write-Host "same step, port $p : HTTP $code"
          }

      - name: A different step - who is still alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          (Get-Process python -ErrorAction SilentlyContinue |
            Select-Object Id, SessionId, StartTime | Out-String) | Write-Host
          foreach ($p in 6080, 6081, 6082) {
            $code = (curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:$p/vnc.html")
            Write-Host "next step, port $p : HTTP $code"
          }
          Write-Host "--- ws80 log ---"
          Get-Content "$env:TEMP\ws80.log","$env:TEMP\ws80.err" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "--- ws81 log ---"
          Get-Content "$env:TEMP\ws81.log","$env:TEMP\ws81.err" -ErrorAction SilentlyContinue | Write-Host
          exit 0

      - name: Reach the survivor from outside, then look again
        shell: pwsh
        run: |
          curl.exe -sL --retry 3 -o "$env:TEMP\cloudflared.exe" `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          # Tunnel whichever port is still answering.
          $port = $null
          foreach ($p in 6080, 6081, 6082) {
            if ((curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:$p/vnc.html") -eq "200") { $port = $p; break }
          }
          if (-not $port) { Write-Host "nothing is serving; nothing to tunnel"; exit 0 }
          Write-Host "tunnelling port $port"

          Start-Process "$env:TEMP\cloudflared.exe" `
            -ArgumentList "tunnel","--url","http://localhost:$port","--no-autoupdate","--loglevel","info" `
            -RedirectStandardOutput "$env:TEMP\cf.log" -RedirectStandardError "$env:TEMP\cf.err" -WindowStyle Hidden
          $url = $null
          foreach ($try in 1..40) {
            Start-Sleep -Seconds 2
            $t = (Get-Content "$env:TEMP\cf.log","$env:TEMP\cf.err" -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($t -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
          }
          Write-Host "tunnel: $url"
          foreach ($try in 1..10) {
            $code = (curl.exe -s -o NUL -w "%{http_code}" -m 20 "$url/vnc.html")
            Write-Host "outside attempt $try : HTTP $code"
            if ($code -eq "200") { break }
            Start-Sleep -Seconds 5
          }
          exit 0

      - name: Two minutes later, is it still there
        shell: pwsh
        run: |
          # The real desk died somewhere between "step 5 said 200" and a client
          # arriving minutes afterwards. This is the same gap, deliberately.
          Start-Sleep -Seconds 120
          foreach ($p in 6080, 6081, 6082) {
            $code = (curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:$p/vnc.html")
            Write-Host "two minutes on, port $p : HTTP $code"
          }
          (Get-Process python -ErrorAction SilentlyContinue | Select-Object Id | Out-String) | Write-Host
          Write-Host "--- ws80 ---"
          Get-Content "$env:TEMP\ws80.log","$env:TEMP\ws80.err" -Tail 20 -ErrorAction SilentlyContinue | Write-Host
          Write-Host "--- ws81 ---"
          Get-Content "$env:TEMP\ws81.log","$env:TEMP\ws81.err" -Tail 20 -ErrorAction SilentlyContinue | Write-Host
          exit 0
