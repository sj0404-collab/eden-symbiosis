<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="manifest.webmanifest">
<title>Eden</title>
<style>
  :root {
    --bg:#101014; --card:#16161c; --line:#2a2a36; --text:#ececf4;
    --dim:#8b8b9c; --pink:#ff2d78; --cyan:#3ee0d4; --on:#1c1c24;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) 0 0;
  }
  header {
    display:flex; align-items:center; gap:10px;
    padding:10px 16px 0;
  }
  header h1 { font-size:24px; font-weight:700; margin:0; letter-spacing:.3px; flex:1; }
  .iconbtn {
    width:40px; height:40px; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--text); font-size:16px; padding:0;
  }
  .search {
    margin:12px 14px 8px; display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:24px; padding:0 14px; height:46px;
    background:transparent;
  }
  .search input {
    flex:1; border:0; outline:0; background:transparent; color:var(--text);
    font:inherit; min-width:0;
  }
  .search input::placeholder { color:var(--dim); }
  .status {
    margin:0 14px 8px; border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; font-size:12.5px; color:var(--dim);
    display:flex; justify-content:space-between; gap:8px; align-items:center;
  }
  .status b { color:var(--text); font-weight:600; }
  .list { flex:1; overflow:auto; padding:0 8px 88px; -webkit-overflow-scrolling:touch; }
  .game {
    display:flex; align-items:center; gap:12px;
    margin:8px; padding:8px; border-radius:16px; border:1px solid var(--line);
    background:var(--card);
  }
  .game:active { background:var(--on); }
  .thumb {
    width:64px; height:64px; border-radius:12px; flex:0 0 64px;
    background:linear-gradient(145deg,#2a1630,#16222a);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--pink);
  }
  .meta { flex:1; min-width:0; }
  .title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--dim); text-align:center; padding:48px 20px; }
  .fab {
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    height:52px; padding:0 18px; border:0; border-radius:26px;
    background:var(--pink); color:#fff; font:600 15px/52px inherit;
    box-shadow:0 8px 24px rgba(255,45,120,.35);
  }
  .sheet {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:5; align-items:flex-end;
  }
  .sheet.on { display:flex; }
  .sheet .box {
    width:100%; background:#14141a; border-radius:18px 18px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2 { margin:0 0 10px; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button.ghost {
    background:transparent; color:var(--cyan); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font:600 13px inherit;
  }
  .note { color:var(--dim); font-size:12.5px; margin-top:8px; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>Eden</h1>
  <button class="iconbtn" id="btn-refresh" title="Найти игры">↻</button>
  <button class="iconbtn" id="btn-more" title="Ещё">⚙</button>
</header>
<div class="search">
  <span style="color:var(--cyan)">⌕</span>
  <input id="q" placeholder="Search games…" autocomplete="off">
</div>
<div class="status" id="status">Ключи · Прошивка · Игры</div>
<div class="list" id="list"><div class="empty">загрузка…</div></div>
<button class="fab" id="fab">＋ Папка</button>

<div class="sheet" id="sheet">
  <div class="box">
    <h2>Папка данных</h2>
    <div class="note" id="root"></div>
    <div class="note" id="modsaves"></div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="btn-data">Сменить папку данных</button>
      <button class="ghost" id="btn-settings">Настройки Eden</button>
      <button class="ghost" id="btn-close">Закрыть</button>
    </div>
    <div class="note" id="hint"></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const N = () => window.Symbiosis || null;
function call(name, ...a) {
  try { const n=N(); return n && n[name] ? n[name](...a) : null; } catch(e) { return null; }
}
function parse(s, fb) { try { return s ? JSON.parse(s) : fb; } catch(e) { return fb; } }

let GAMES = [];

function render() {
  const q = ($('q').value || '').trim().toLowerCase();
  const list = q ? GAMES.filter(g => (g.title||'').toLowerCase().includes(q) || (g.developer||'').toLowerCase().includes(q)) : GAMES;
  if (!N()) {
    $('list').innerHTML = '<div class="empty">Откройте из APK Eden</div>';
    return;
  }
  if (!list.length) {
    $('list').innerHTML = '<div class="empty">' + (GAMES.length ? 'ничего не найдено' : 'Нет игр. Нажмите «Папка» и укажите каталог с .nsp / .xci, затем ↻') + '</div>';
    return;
  }
  $('list').innerHTML = list.map((g,i) => `
    <div class="game" data-i="${GAMES.indexOf(g)}">
      <div class="thumb">▶</div>
      <div class="meta">
        <div class="title">${esc(g.title || 'без имени')}</div>
        <div class="sub">${esc(g.developer || g.programId || '')}</div>
      </div>
    </div>`).join('');
  $('list').querySelectorAll('.game').forEach(el => {
    el.addEventListener('click', () => play(GAMES[+el.dataset.i]));
  });
}

function play(g) {
  if (!g || !g.path) return;
  if (!N() || typeof N().launch !== 'function') { alert('Нужен APK'); return; }
  N().launch(g.path, g.title || '');
}

function loadGames() {
  const data = parse(call('games'), { games: [] });
  GAMES = data.games || [];
  render();
}

function loadStatus() {
  const st = parse(call('status'), null);
  const mods = parse(call('mods'), null);
  const saves = parse(call('saves'), null);
  const root = parse(call('dataRoot'), null);
  if (st && st.items) {
    $('status').innerHTML = st.items.map(it =>
      `<span><b>${esc(it.label)}</b> ${it.present ? '✓' : '✕'}</span>`
    ).join(' · ');
  }
  $('root').textContent = 'корень: ' + ((root && root.path) || (st && st.dataRoot) || '—');
  const mc = mods && mods.items ? mods.items.length : 0;
  const sc = saves && saves.items ? saves.items.length : 0;
  $('modsaves').textContent = 'моды: ' + mc + '  ·  сейвы: ' + sc;
  const sug = parse(call('suggestRoots'), null);
  $('hint').textContent = (sug && sug.roots && sug.roots.length)
    ? 'На устройстве есть другая установка Eden с данными. Смените папку данных на неё, если моды/сейвы пустые.'
    : '';
}

$('q').addEventListener('input', render);
$('fab').onclick = () => { if (N() && N().pickFolder) N().pickFolder(); else alert('Нужен APK'); };
$('btn-refresh').onclick = () => {
  if (N() && N().rescan) N().rescan();
  $('list').innerHTML = '<div class="empty">ищу…</div>';
  setTimeout(loadGames, 1200);
};
$('btn-more').onclick = () => { loadStatus(); $('sheet').classList.add('on'); };
$('btn-close').onclick = () => $('sheet').classList.remove('on');
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.classList.remove('on'); });
$('btn-data').onclick = () => { if (N() && N().pickDataRoot) N().pickDataRoot(); };
$('btn-settings').onclick = () => { if (N() && N().openSettings) N().openSettings(); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadGames();
loadStatus();
</script>
</body>
</html>
